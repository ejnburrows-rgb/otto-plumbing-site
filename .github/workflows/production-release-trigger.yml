name: One-time production release trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish once and remove this trigger
        run: |
          git config user.name "OTTO Release"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/production-release-trigger.yml
          git commit -m "Trigger production hosting release"
          git push origin main
