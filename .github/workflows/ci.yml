name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: anishathalye/proof-html@v2
        with:
          directory: '.'

      - name: Check manifest.json is valid JSON
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Check SVG files are well-formed
        run: |
          for f in *.svg; do
            echo "Checking $f"
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')"
          done

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check facelift.js
          node --check intake-config.js
          node --check intake-core.js
          node --check intake.js
          node --check prestige.js
          node --check shell.js
          node --check stages.js
          node --check whatsapp.js

      - name: Run website regression tests
        run: node --test tests/*.test.mjs

      - name: Verify production integration hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          config = Path('intake-config.js').read_text()
          required_html = [
              'id="request"',
              'id="intakeForm"',
              'src="intake-config.js"',
              'src="intake-core.js"',
              'src="intake.js"',
              'href="shell.css"',
              'href="facelift.css"',
              'href="prestige.css"',
              'href="stages.css"',
              'href="stages-theme.css"',
          ]
          required_bootstrap = [
              "script('prestige.js'",
              "script('facelift.js'",
              "script('whatsapp.js'",
              "script('shell.js'",
              "script('stages.js'",
          ]
          missing = [x for x in required_html if x not in html]
          missing += [x for x in required_bootstrap if x not in config]
          if missing:
              raise SystemExit('Missing integration hooks: ' + ', '.join(missing))
          print('Production integration hooks verified.')
          PY

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
