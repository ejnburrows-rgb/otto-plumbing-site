<head>

  <style>
    html,body{margin:0;min-height:100%;background:#f4f7fb;color:#162033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading strong{font-size:1.2rem}.loading span{display:block;margin-top:8px;color:#5a667c}
  </style>
</head>
<body>
  <div class="loading"><div><strong>OTTO Plumbing Inc.</strong><span>Loading service request…</span></div></div>
  <script>
  (function(){
    function clean(html){
      return html
        .replaceAll('OTTO Plumbing Inc. — South Florida Plumbing Since 1996','OTTO Plumbing Inc. — South Florida Plumbing')
        .replace(/\s*"foundingDate"\s*:\s*"1996"\s*,?/g,'')
        .replaceAll('South Florida plumbing · Established 1996','South Florida plumbing')
        .replaceAll('Plomería en el sur de Florida · Desde 1996','Plomería en el sur de Florida')
        .replaceAll('Licensed. Established. Easy to verify.','Licensed. Easy to verify.')
        .replaceAll('Con licencia. Establecida. Fácil de verificar.','Con licencia. Fácil de verificar.')
        .replaceAll('reviewing plans beside copper rough-in work and a service van in 1996.','reviewing plans beside copper rough-in work and a service van.');
    }
    fetch('./index.html',{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('site_load_failed');return r.text();})
      .then(function(html){document.open();document.write(clean(html));document.close();})
      .catch(function(){location.replace('./index.html');});
  })();
  </script>
  <noscript><p><a href="./index.html">Open OTTO Plumbing</a></p></noscript>
</body>
